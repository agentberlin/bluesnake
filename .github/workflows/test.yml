name: test

# The project's test suite (lint + unit + acceptance + race). Runs on every pull
# request to main and every push to main, and is reused by the release workflow
# (workflow_call) so a tagged release can never ship code that fails tests.
#
# Not pure Go, and it leans on the runner image: `make race` needs cgo and the
# image's gcc (on Linux the race detector requires a host C toolchain), and the
# render tests (internal/render, plus Chrome-driven tests in internal/crawler and
# internal/sitecheck) launch the image's preinstalled Google Chrome, sandboxed
# (chromedp only adds --no-sandbox as root), so the image must let Chrome create
# user namespaces (Ubuntu's AppArmor `chrome` profile does). They skip only when
# no Chrome binary is found, so here they run; only the godog @chrome acceptance
# scenarios are opt-in and excluded (see test/acceptance_test.go). The job takes
# ~3-4 min.
#
# The desktop (Wails) package is outside `make test`, and release.yml only builds
# it (per-OS, with the platform GUI toolchain). Its unit tests run here under
# `make race`: plain `go test` compiles none of Wails' GUI frontend (that needs
# the wails CLI's build tags), so no GTK/WebKit is required.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs of the same PR; never cancel a push/release run.
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint + unit + acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        # Scoped to the packages `make test` covers (the desktop package is not
        # one of them; see the header).
        run: go vet ./internal/... ./cmd/... ./tunnelserver/... ./test/...

      - name: Unit + acceptance tests
        run: make test

      - name: Race detector (concurrency-critical packages)
        run: make race
